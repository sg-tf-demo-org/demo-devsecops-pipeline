name: image-build

# Build → Trivy image (block HIGH/CRITICAL) → cosign sign → cosign verify (CI-only trust anchor).
# No cluster signature enforcement in v1.

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      fixture_path:
        description: "Dockerfile directory under fixtures/"
        required: false
        default: "app"

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      FIXTURE: ${{ github.event.inputs.fixture_path || 'app' }}
      IMAGE_NAME: devsecops-demo
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: meta
        run: |
          echo "tag=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "dir=${FIXTURE}" >> "$GITHUB_OUTPUT"

      - name: Build image (local tag only)
        run: |
          docker build -t "${{ steps.meta.outputs.tag }}" "${{ steps.meta.outputs.dir }}"

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Cosign keygen + sign + verify (ephemeral CI key)
        run: |
          set -euo pipefail
          COSIGN_PASSWORD= cosign generate-key-pair
          COSIGN_PASSWORD= cosign sign --key cosign.key --yes "${{ steps.meta.outputs.tag }}"
          COSIGN_PASSWORD= cosign verify --key cosign.pub "${{ steps.meta.outputs.tag }}"
          echo "cosign verify OK for ${{ steps.meta.outputs.tag }}"
